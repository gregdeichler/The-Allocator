name: Publish Release

on:
  push:
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish ./TheAllocator.csproj -c Release -r win-x64 --self-contained true -o ./release/1.1.0/app
          Compress-Archive -Path ./release/1.1.0/app/* -DestinationPath ./TheAllocator-1.1.0-win-x64.zip -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 `
            "./TheAllocator-1.1.0-win-x64.zip" `
            --target $env:GITHUB_SHA `
            --title "The Allocator 1.1.0" `
            --notes-file "docs/Release-Notes-v1.1.0.md"
